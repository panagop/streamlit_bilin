[project]
name = "bilin"
version = "0.2.0"
description = "Bilinear idealisation of force-deformation curves, with a Streamlit front end"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bilin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tests/generate_reference.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters in strings/docstrings are intentional

[tool.mypy]
strict = true
files = ["src", "tests", "app.py"]
exclude = ["tests/generate_reference\\.py"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
